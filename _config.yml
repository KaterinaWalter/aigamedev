title: Game Dev Prompt Library
description: AI prompts for game development
theme: just-the-docs
color_scheme: dark

url: https://KaterinaWalter.github.io/aigamedev

logo: "assets/webdocs-logo.png"
favicon_ico: "favicon.ico"

aux_links_new_tab: true
aux_links:  
  "DevDocs":
    - "https://devdocs.io/"

back_to_top: true
back_to_top_text: "↑ TO TOP"

kramdown:
  parse_block_html: true

callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
